# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: cffsconfig-k8s-sync
spec:
  steps:
    - name: step-00
      try:
        - apply:
            file: 00-install.yaml
        - wait:
            timeout: 5m
            apiVersion: batch/v1
            kind: Job
            selector: kind=e2e-test-job
            for:
              condition:
                name: complete
    - name: step-01
      try:
        - assert:
            file: 00-assert.yaml
      # skipDelete leaves applied resources, and the cluster-scoped source outlives the test namespace
      cleanup:
        - delete:
            ref:
              apiVersion: core.openfeature.dev/v1beta1
              kind: ClusterFeatureFlagSource
              name: (join('-', [$namespace, 'cluster-source']))
