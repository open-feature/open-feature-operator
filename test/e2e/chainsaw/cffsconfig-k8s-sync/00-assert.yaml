apiVersion: v1
kind: Pod
metadata:
  annotations:
    openfeature.dev/allowkubernetessync: "true"
    openfeature.dev/kubernetessyncscope: cluster
    openfeature.dev/enabled: "true"
  labels:
    app: open-feature-e2e-test
status:
  phase: Running
spec:
  containers:
    - name: open-feature-e2e-test
      image: nginx:stable-alpine
  initContainers:
    - name: flagd          # verifies flagd injection happened for a cluster-scoped source
      restartPolicy: Always
