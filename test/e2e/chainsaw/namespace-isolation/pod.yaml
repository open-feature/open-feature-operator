# owned, so admission does not reject it as a static pod before checking its configuration
apiVersion: v1
kind: Pod
metadata:
  name: ($podName)
  annotations: ($annotations)
  ownerReferences:
    - apiVersion: v1
      kind: ConfigMap
      name: owner
      uid: 00000000-0000-0000-0000-000000000001
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
