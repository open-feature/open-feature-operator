apiVersion: v1
kind: Namespace
metadata:
  name: (join('-', [$namespace, 'other']))
---
apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: flags
spec:
  flagSpec:
    flags:
      own: {state: ENABLED, variants: {"on": true, "off": false}, defaultVariant: "on"}
---
apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: flags
  namespace: (join('-', [$namespace, 'other']))
spec:
  flagSpec:
    flags:
      other: {state: ENABLED, variants: {"on": true, "off": false}, defaultVariant: "on"}
---
apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlagSource
metadata:
  name: same-namespace
spec:
  sources:
    - source: flags
      provider: kubernetes
---
apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlagSource
metadata:
  name: cross-namespace-kubernetes
spec:
  sources:
    - source: (join('/', [join('-', [$namespace, 'other']), 'flags']))
      provider: kubernetes
---
apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlagSource
metadata:
  name: cross-namespace-file
spec:
  sources:
    - source: (join('/', [join('-', [$namespace, 'other']), 'flags']))
      provider: file
---
apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlagSource
metadata:
  name: cross-namespace-default-provider
spec:
  defaultSyncProvider: kubernetes
  sources:
    - source: (join('/', [join('-', [$namespace, 'other']), 'flags']))
---
apiVersion: core.openfeature.dev/v1beta1
kind: InProcessConfiguration
metadata:
  name: other-ipc
  namespace: (join('-', [$namespace, 'other']))
spec:
  host: other-host
---
apiVersion: core.openfeature.dev/v1beta1
kind: ClusterFeatureFlagSource
metadata:
  name: (join('-', [$namespace, 'no-conditions']))
spec:
  sources:
    - source: (join('/', [$namespace, 'flags']))
      provider: kubernetes
---
apiVersion: core.openfeature.dev/v1beta1
kind: ClusterFeatureFlagSource
metadata:
  name: (join('-', [$namespace, 'other-only']))
spec:
  sources:
    - source: (join('/', [$namespace, 'flags']))
      provider: kubernetes
  conditions:
    - namespaces:
        - (join('-', [$namespace, 'other']))
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: isolation-sa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: same-namespace
spec:
  replicas: 1
  selector:
    matchLabels: {app: same-namespace}
  template:
    metadata:
      labels: {app: same-namespace}
      annotations:
        openfeature.dev/enabled: "true"
        openfeature.dev/featureflagsource: same-namespace
    spec:
      serviceAccountName: isolation-sa
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
