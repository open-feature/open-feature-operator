apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlagSource
metadata:
  name: ffs-crossns-bad
  namespace: default
spec:
  evaluator: json
  defaultSyncProvider: kubernetes
  sources:
    # cross-namespace inner source is rejected on a namespaced FeatureFlagSource
    - source: other-namespace/end-to-end-test
      provider: kubernetes
  probesEnabled: true
