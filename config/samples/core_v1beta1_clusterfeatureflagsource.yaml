apiVersion: core.openfeature.dev/v1beta1
kind: ClusterFeatureFlagSource
metadata:
  name: clusterfeatureflagsource-sample
spec:
  managementPort: 8080
  evaluator: json
  defaultSyncProvider: kubernetes
  # cluster-scoped sources must qualify their inner source with a namespace
  sources:
    - source: open-feature-demo/featureflag-sample
      provider: kubernetes
  probesEnabled: true
  # no conditions means no namespace may use this resource
  conditions:
    - namespaces: [open-feature-demo]
    - namespaceSelector:
        matchLabels:
          openfeature.dev/shared-config: "true"
