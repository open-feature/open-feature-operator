# permissions for end users to edit clusterfeatureflagsources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusterfeatureflagsource-editor-role
rules:
- apiGroups:
  - core.openfeature.dev
  resources:
  - clusterfeatureflagsources
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - core.openfeature.dev
  resources:
  - clusterfeatureflagsources/status
  verbs:
  - get
