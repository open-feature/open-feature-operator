# permissions for end users to edit clusterinprocessconfigurations.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusterinprocessconfiguration-editor-role
rules:
- apiGroups:
  - core.openfeature.dev
  resources:
  - clusterinprocessconfigurations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - core.openfeature.dev
  resources:
  - clusterinprocessconfigurations/status
  verbs:
  - get
