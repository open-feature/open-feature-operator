# permissions for end users to view clusterinprocessconfigurations.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusterinprocessconfiguration-viewer-role
rules:
- apiGroups:
  - core.openfeature.dev
  resources:
  - clusterinprocessconfigurations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - core.openfeature.dev
  resources:
  - clusterinprocessconfigurations/status
  verbs:
  - get
